name: probe token fingerprint (temporary, removed before merge)
on:
  push:
    branches: [test/important-mail]
    paths: [.github/workflows/probe-fp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: salted 8-char fingerprint of MONDAY_API_TOKEN (not the token)
        env:
          T: ${{ secrets.MONDAY_API_TOKEN }}
        run: python3 -c "import hashlib,os;print(\"fp:\", hashlib.sha256(b\"fp-16.11:\"+os.environ[\"T\"].strip().encode()).hexdigest()[:8])"
