name: finance-ping (temporary e2e — removed before merge)
on:
  push:
    branches: [test/finance-bot]
    paths: [.github/workflows/finance-ping.yml]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: send one test suggestion to the finance bot
        env:
          FINANCE_BOT_TOKEN: ${{ secrets.FINANCE_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, datetime
          tok = os.environ["FINANCE_BOT_TOKEN"].strip()
          body = json.dumps({"vendor": "בדיקה · חיבור בוט המיילים", "amount": 1.23,
                             "date": datetime.date.today().isoformat(), "business": False}).encode()
          req = urllib.request.Request("https://bot-finance-mu.vercel.app/api/webhook?ingest", data=body, method="POST",
              headers={"Content-Type": "application/json",
                       "X-Ingest-Secret": hashlib.sha256(b"ingest:" + tok.encode()).hexdigest()[:32]})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("status", r.status, r.read().decode())
          except urllib.error.HTTPError as e:
              print("status", e.code); raise SystemExit(1)
          PY
