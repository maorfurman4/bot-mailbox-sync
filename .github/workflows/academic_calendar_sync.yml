name: Mail Manager

on:
  schedule:
    - cron: "0 5 * * *"    # 08:00 שעון קיץ / 07:00 חורף
    - cron: "0 11 * * *"   # 14:00 / 13:00
    - cron: "0 17 * * *"   # 20:00 / 19:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "הרצה יבשה — רק מדפיס החלטות, בלי לגעת במייל/יומן/טלגרם"
        type: boolean
        default: false
      organize_all:
        description: "לסדר בתוויות גם את כל התיבה ו-60 יום אחורה (בלי טלגרם ויומן)"
        type: boolean
        default: false
      tidy_inbox:
        description: "כל מה שבתיבה מקבל תווית ועובר למקום שלו (חד-פעמי, בלי טלגרם ויומן)"
        type: boolean
        default: false
      merge_labels:
        description: "להעביר את התוויות הישנות לתוויות החדשות ולמחוק אותן (חד-פעמי)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mail manager
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ORGANIZE_ALL: ${{ inputs.organize_all && '1' || '' }}
          MERGE_LABELS: ${{ inputs.merge_labels && '1' || '' }}
          TIDY_INBOX: ${{ inputs.tidy_inbox && '1' || '' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TOKEN_RECEIPTS: ${{ secrets.TELEGRAM_TOKEN_RECEIPTS }}
          CHAT_ID_RECEIPTS: ${{ secrets.CHAT_ID_RECEIPTS }}
        run: python sync_script.py
